
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Task Manager</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <main class="card">
    <h1>My Tasks<span>.</span></h1>
    <p class="sub">Stay focused. Get things done.</p>

    <div class="input-box">
      <input id="taskInput" placeholder="Enter a task...">
      <button id="addBtn">Add +</button>
    </div>

    <p class="count">Total tasks: <span id="taskCount">0</span></p>
    <ul id="taskList"></ul>

    <button id="clearAll" class="clear">Clear all tasks</button>
  </main>
  <script src="index.js"></script>
</body>
</html>
